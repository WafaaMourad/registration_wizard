<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- bootstrap css -->
    <link rel="stylesheet" href="Css/bootstrap.min.css">
    <!-- style css -->
     <link rel="stylesheet" href="Css/style.css">
</head>
<body style="background-color: #f6f8ff;">

    <div class="container mt-10 pt-5">
        <div class="row">
            <div class="md:col-6">
                <img src="media/56f58c5bbae6320e1aa5d36445fd722b.jpg" class="w-75">
            </div>

            <div class="md:col-6">
                <h2>Create Account</h2>
                <h4 class="mt-4 mb-7 fg-secondary">Go ahead and sign up, let everyone <br> know how awesome you are!</h4>
                
                <h5 id="result"></h5>

                <form onsubmit="return validateData()" action="success.html" method="post">
                        <input id="user" class="form-control p-4 mb-7 rounded-2" type="text" name="user" placeholder="User Name">

                        <input id="email" class="form-control p-4 mb-7 rounded-2" type="text" name="email" placeholder="Email">

                        <input id="pass" class="form-control p-4 mb-7 rounded-2" type="password" name="pass" placeholder="Password">

                        <input id="confirm" class="form-control p-4 mb-7 rounded-2" type="password" name="confirm" placeholder="Confirm Password">

                        <input type="submit" value="Create New Account" class="btn-solid theme-primary form-control">
                </form>
            </div>
        </div>
    </div>
    

    <!-- bootstrap js -->
    <script src="js/bootstrap.bundle.min.js"></script>
     <!-- javascript -->
      <script src="js/main.js"></script>
</body>
</html>
